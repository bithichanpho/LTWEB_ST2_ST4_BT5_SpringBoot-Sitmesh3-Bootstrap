spring.application.name=SpringBootShop


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringBootShop;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
 
 
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

sitemesh.integration=view-resolver

sitemesh.decorator.prefix=/WEB-INF/decorators/

sitemesh.decorator.mappings[0].path=/admin/*
sitemesh.decorator.mappings[0].decorator=main.jsp

sitemesh.dispatchMode=include

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB


app.upload.dir=${user.home}/shopapp-uploads

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true