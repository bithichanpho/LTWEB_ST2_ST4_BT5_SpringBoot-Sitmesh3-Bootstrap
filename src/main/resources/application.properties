spring.application.name=SpringBootShop
# ---- SQL Server datasource (same DB as the original project) ----
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringBootShop;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
 
# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
 
# ---- JSP views ----
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
 
# ---- File upload (product / category images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
 
# Folder on disk (outside the app) where uploaded images are persisted.
# Falls back to bundled sample images under src/main/resources/static/image
# when a file isn't found there (see WebConfig).
app.upload.dir=${user.home}/shopapp-uploads